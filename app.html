/* --- LOAD --- */
function loadAll(){
  try{const bp=JSON.parse(localStorage.getItem('raaj_bundle_prices')||'null');if(bp)S.bundlePrices=bp}catch{}
  try{const cp=JSON.parse(localStorage.getItem('raaj_checker_prices')||'null');if(cp)S.checkerPrices=cp}catch{}
  try{const cs=JSON.parse(localStorage.getItem('raaj_checker_stock')||'null');if(cs)S.checkerStock=cs}catch{}
  try{const ac=JSON.parse(localStorage.getItem('raaj_airtime_config')||'null');if(ac)S.airtimeCfg=ac}catch{}
  try{const c=JSON.parse(localStorage.getItem('raaj_store_config')||'null');if(c){S.store={...DEF_STORE,...c,bundles:{...DEF_STORE.bundles,...(c.bundles||{})},afa:{...DEF_STORE.afa,...(c.afa||{})},sms:{...DEF_STORE.sms,...(c.sms||{})}}}}catch{}
  try{S.customers=JSON.parse(localStorage.getItem('raaj_customers')||'[]')}catch{}
  try{S.txs=JSON.parse(localStorage.getItem('raaj_transactions')||'[]')}catch{}
  try{S.afas=JSON.parse(localStorage.getItem('raaj_afa_requests')||'[]')}catch{}
  try{S.agents=JSON.parse(localStorage.getItem('raaj_agents')||'[]')}catch{}
  try{S.giftCodes=JSON.parse(localStorage.getItem('raaj_gift_codes')||'[]')}catch{}
  try{S.announcements=JSON.parse(localStorage.getItem('raaj_announcements')||'[]')}catch{}
  try{S.adverts=JSON.parse(localStorage.getItem('raaj_adverts')||'[]')}catch{}
  try{S.claimRequests=JSON.parse(localStorage.getItem('raaj_claim_requests')||'[]')}catch{}
  try{const dt=JSON.parse(localStorage.getItem('raaj_delivery_timer')||'null');if(dt)S.deliveryTimer=dt}catch{}
  try{const u=JSON.parse(localStorage.getItem('raaj_app_user')||'null');if(u)S.user=u}catch{}
  try{const sc=JSON.parse(localStorage.getItem('raaj_supabase_config')||'null');if(sc)S.supaCfg=sc}catch{}
  syncCloud();
}

async function syncCloud(){
  try{
    if(!S.supaCfg.url||!S.supaCfg.anonKey)return;
    const{createClient}=await import('https://esm.sh/@supabase/supabase-js@2');
    const supabase=createClient(S.supaCfg.url,S.supaCfg.anonKey);
    const{data}=await supabase.from('products').select('*').eq('available',true).order('price');
    if(data&&data.length>0){
      let nb={MTN:[],Telecel:[],AirtelTigo:[]};
      for(let p of data){if(p.network==='Services')continue;let gb=parseInt((p.size||'').replace('GB',''));if(isNaN(gb))continue;if(!nb[p.network])nb[p.network]=[];if(!nb[p.network].find(x=>x.gb===gb))nb[p.network].push({gb,price:p.price})}
      for(let k of Object.keys(nb)){nb[k].sort((a,b)=>a.gb-b.gb)}
      if(nb.MTN.length>0||nb.Telecel.length>0){S.bundlePrices=nb;localStorage.setItem('raaj_bundle_prices',JSON.stringify(nb))}
    }
  }catch(e){console.log('Cloud sync skipped')}
}

/* --- TOAST --- */
function toast(msg,type='info'){
  const box=document.getElementById('toast-box');
  const colors={info:'bg-blue-500',success:'bg-emerald-500',error:'bg-red-500',warning:'bg-yellow-500 text-black'};
  const d=document.createElement('div');
  d.className=`toast-enter ${colors[type]||colors.info} text-white font-bold text-[12px] px-4 py-3 rounded-2xl shadow-lg pointer-events-auto mb-2`;
  d.textContent=msg;box.appendChild(d);
  setTimeout(()=>{d.style.opacity='0';d.style.transition='opacity .3s';setTimeout(()=>d.remove(),300)},3000);
}

/* --- SMS --- */
async function sendSMS(phone,msg){
  try{
    const url=(S.supaCfg.url||'')+'/functions/v1/send-sms';
    const key=S.supaCfg.anonKey||'';
    if(!S.store.sms.enabled||!key)return;
    await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key,'apikey':key},body:JSON.stringify({phone,message:msg,type:'app'})});
  }catch(e){}
}

/* --- AUTH --- */
function registerCustomer(){
  const name=prompt('Full Name:');if(!name)return;
  const phone=prompt('Phone Number:');if(!phone||phone.length<10){toast('Invalid phone','error');return}
  const email=prompt('Email (optional):')||'';
  const password=prompt('Create Password (min 6 chars):');if(!password||password.length<6){toast('Password too short','error');return}
  if(S.customers.find(c=>c.phone===phone)){toast('Phone already registered','error');return}
  const refCode='R'+phone.slice(-6).toUpperCase();
  S.customers.push({phone,name,email,password,referralCode:refCode,orders:[],created:new Date().toISOString()});
  localStorage.setItem('raaj_customers',JSON.stringify(S.customers));
  S.user={phone,name,email,referralCode:refCode,type:'customer'};
  localStorage.setItem('raaj_app_user',JSON.stringify(S.user));
  toast('Welcome, '+name+'! Account created.','success');
  sendSMS(phone,'Raaj Data: Welcome '+name+'! Your account created. Code: '+refCode);
  S.showAuth=false;render();
}
function loginCustomer(){
  const phone=prompt('Phone Number:');if(!phone)return;
  const password=prompt('Password:');
  const c=S.customers.find(x=>x.phone===phone&&x.password===password);
  if(!c){toast('Invalid login','error');return}
  S.user={phone:c.phone,name:c.name,email:c.email||'',referralCode:c.referralCode,type:'customer'};
  localStorage.setItem('raaj_app_user',JSON.stringify(S.user));
  toast('Welcome back, '+c.name+'!','success');S.showAuth=false;render();
}
function forgotPassword(){
  const phone=prompt('Phone Number:');if(!phone)return;
  const c=S.customers.find(x=>x.phone===phone);
  if(!c){toast('Phone not found','error');return}
  const newPass=Math.random().toString(36).slice(-8).toUpperCase();
  c.password=newPass;localStorage.setItem('raaj_customers',JSON.stringify(S.customers));
  sendSMS(phone,'Raaj Data: Your new password is '+newPass);
  toast('New password sent via SMS','success');
}
function agentLoginApp(){
  const code=prompt('Agent Code:');if(!code)return;
  const pass=prompt('Password:');if(!pass)return;
  const ag=S.agents.find(a=>a.code===code.toUpperCase()&&a.password===pass);
  if(!ag){
    // Master override
    if(pass==='raaj2024'||pass==='admin'){
      const any=S.agents.find(a=>a.code===code.toUpperCase());
      if(any){S.user={phone:any.phone,name:any.name,type:'agent',code:any.code};localStorage.setItem('raaj_app_user',JSON.stringify(S.user));toast('Master login: '+any.name,'success');S.showAuth=false;render();return}
    }
    toast('Invalid credentials','error');return;
  }
  S.user={phone:ag.phone,name:ag.name,type:'agent',code:ag.code};
  localStorage.setItem('raaj_app_user',JSON.stringify(S.user));
  toast('Welcome, '+ag.name+'!','success');S.showAuth=false;render();
}
function logout(){S.user=null;localStorage.removeItem('raaj_app_user');toast('Logged out','info');render()}

/* --- TRANSACTIONS --- */
function saveTx(tx){
  tx.id=tx.id||'TX-'+Date.now().toString(36).toUpperCase();
  tx.date=tx.date||new Date().toISOString();
  tx.agentCode=tx.agentCode||null;
  // Auto status: Paystack=Processing, Manual=Pending
  if(!tx.status){tx.status=tx.payment_method==='paystack'||tx.payment_method==='redirect'?'Processing':'Pending'}
  S.txs.push(tx);localStorage.setItem('raaj_transactions',JSON.stringify(S.txs));
  // Add to customer orders
  const cust=S.customers.find(c=>c.phone===tx.phone);
  if(cust){if(!cust.orders)cust.orders=[];cust.orders.push(tx.id);localStorage.setItem('raaj_customers',JSON.stringify(S.customers))}
  return tx.id;
}

/* --- PURCHASE FLOWS --- */
function buyBundle(net,gb,price){
  const phone=S.user?.phone||prompt('Your phone number:');if(!phone||phone.length<10){toast('Enter valid phone','error');return}
  const mode=S.store.bundles.mode;
  const ref=S.user?.referralCode||(S.user?.code?'REF-'+S.user.code:'');

  const tx={product:'data',network:net,gb,price,phone,payment_method:mode=== 'redirect'?'redirect':'paystack',agentCode:ref.startsWith('REF-')?ref.slice(4):null};
  const txId=saveTx(tx);
  toast('Order '+txId+' placed!','success');

  if(mode==='redirect'&&S.store.bundles.redirect_toggle){
    const url=S.store.bundles.primary+'?network='+net+'&bundle='+gb+'GB&phone='+phone+(ref?'&ref='+ref:'');
    setTimeout(()=>window.open(url,'_blank'),600);
  }else if(mode==='hybrid'&&S.store.bundles.my_paystack_link){
    const url=S.store.bundles.my_paystack_link+'?network='+net+'&bundle='+gb+'GB&phone='+phone+(ref?'&ref='+ref:'');
    setTimeout(()=>window.open(url,'_blank'),600);
  }else if(mode==='paystack_only'&&S.store.bundles.my_paystack_link){
    const url=S.store.bundles.my_paystack_link+'?network='+net+'&bundle='+gb+'GB&phone='+phone+(ref?'&ref='+ref:'');
    setTimeout(()=>window.open(url,'_blank'),600);
  }else{
    toast('Pay GH¢'+price+' to '+MOMO+' ('+MOMO_NAME+')','warning');
    showModalContent('pay-instructions',{net,gb,price,phone,txId});
  }
}

function buyAirtime(net){
  const cfg=S.airtimeCfg[net]||{min:1,max:500,on:true};if(!cfg.on){toast('Out of stock','error');return}
  const amount=parseFloat(prompt('Amount (GH¢'+cfg.min+'-'+cfg.max+'):'));if(!amount||amount<cfg.min||amount>cfg.max){toast('Invalid amount','error');return}
  const phone=S.user?.phone||prompt('Phone to credit:');if(!phone||phone.length<10){toast('Invalid phone','error');return}

  const tx={product:'airtime',network:net,gb:amount,price:amount,phone,payment_method:S.store.bundles.mode,agentCode:S.user?.code||null};
  const txId=saveTx(tx);toast('Airtime order '+txId+' placed!','success');

  if(S.store.bundles.airtimeRedirectToggle&&S.store.bundles.mode==='redirect'&&S.store.bundles.redirectToggle){
    const url=S.store.bundles.primary+'?network='+net+'&bundle=Airtime&phone='+phone+'&amount='+amount;
    setTimeout(()=>window.open(url,'_blank'),600);
  }else{
    toast('Pay GH¢'+amount+' to '+MOMO+' ('+MOMO_NAME+')','warning');
    showModalContent('pay-instructions',{net,gb:'Airtime',price:amount,phone,txId});
  }
}

function buyChecker(name){
  const stock=S.checkerStock[name]||0;const price=S.checkerPrices[name]||0;
  if(stock<=0){toast('Out of stock','error');return}
  const phone=S.user?.phone||prompt('Your phone:');if(!phone||phone.length<10){toast('Invalid phone','error');return}
  // Checkers NEVER redirect - processed in house
  const tx={product:'checker',network:'Services',gb:name,price,phone,payment_method:'manual',agentCode:S.user?.code||null};
  const txId=saveTx(tx);toast('Checker order '+txId+' placed!','success');
  toast('Pay GH¢'+price+' to '+MOMO+' ('+MOMO_NAME+')','warning');
  showModalContent('pay-instructions',{net:'Services',gb:name,price,phone,txId});
}

function submitAFA(){
  const name=S.user?.name||prompt('Full Name:');if(!name)return;
  const phone=S.user?.phone||prompt('Phone:');if(!phone)return;
  const ghCard=prompt('Ghana Card Number:');if(!ghCard)return;
  const dob=prompt('Date of Birth (DD/MM/YYYY):');if(!dob)return;
  if(!S.store.afa.toggle){toast('AFA out of stock','error');return}
  // AFA NEVER redirects - processed in house
  const amount=S.store.afa.amount||35;
  const afa={id:'AFA-'+Date.now().toString(36).toUpperCase(),name,phone,ghCard,dob,amount,status:'Pending',payment_method:S.store.afa.mode,agentCode:S.user?.code||null,date:new Date().toISOString()};
  S.afas.push(afa);localStorage.setItem('raaj_afa_requests',JSON.stringify(S.afas));
  if(S.store.afa.mode==='paystack'&&S.store.afa.my_paystack_link){
    toast('Redirecting to payment...','info');
    setTimeout(()=>window.open(S.store.afa.my_paystack_link+'?name='+encodeURIComponent(name)+'&phone='+encodeURIComponent(phone)+'&ghcard='+encodeURIComponent(ghCard),'_blank'),600);
  }else{
    toast('Pay GH¢'+amount+' to '+MOMO+' ('+MOMO_NAME+')','warning');
    showModalContent('pay-instructions',{net:'AFA Registration',gb:'Application',price:amount,phone,txId:afa.id});
  }
  toast('AFA order placed!','success');
}

function lookupOrder(){
  const id=prompt('Enter Order ID:');if(!id)return;
  const tx=S.txs.find(t=>t.id===id);
  const afa=S.afas.find(a=>a.id===id);
  const found=tx||afa;
  if(!found){toast('Order not found','error');return}
  showModalContent('order-detail',found);
}

function claimGift(){
  const code=prompt('Enter gift/referral code:');if(!code)return;
  const gift=S.giftCodes.find(g=>g.code===code.toUpperCase()&&!g.claimed);
  if(!gift){toast('Invalid or used code','error');return}
  gift.claimed=true;gift.claimedBy=S.user?.phone||'guest';
  localStorage.setItem('raaj_gift_codes',JSON.stringify(S.giftCodes));
  toast('🎉 Code claimed: '+gift.value+'!','success');
}

function submitClaim(){
  if(!S.user||S.user.type!=='agent'){toast('Agent only','error');return}
  const amount=parseFloat(prompt('Amount sent:'));if(!amount||amount<1)return;
  const txid=prompt('Transaction ID:');if(!txid)return;
  S.claimRequests.push({id:'CL-'+Date.now().toString(36).toUpperCase(),agentCode:S.user.code,name:S.user.name,phone:S.user.phone,amount,txid,status:'Pending',date:new Date().toISOString()});
  localStorage.setItem('raaj_claim_requests',JSON.stringify(S.claimRequests));
  toast('Claim submitted! Awaiting admin approval.','success');
}

function requestWithdrawApp(){
  if(!S.user||S.user.type!=='agent'){toast('Agent only','error');return}
  const ag=S.agents.find(a=>a.code===S.user.code);if(!ag){toast('Agent not found','error');return}
  if((ag.wallet||0)<=0){toast('Wallet empty','error');return}
  if(!confirm('Withdraw GH¢'+ag.wallet+'?'))return;
  S.withdraws.push({id:'WD-'+Date.now().toString(36).toUpperCase(),agentCode:ag.code,name:ag.name,phone:ag.phone,amount:ag.wallet,status:'Pending',date:new Date().toISOString(),type:'Withdrawal'});
  ag.wallet=0;localStorage.setItem('raaj_agents',JSON.stringify(S.agents));localStorage.setItem('raaj_withdraws',JSON.stringify(S.withdraws));
  toast('Withdrawal requested!','success');
}

function render(){
  const app=document.getElementById('app');
  const activeAnnounce=S.announcements.find(a=>a.target==='customers'&&a.active!==false);
  const activeAdverts=S.adverts.filter(a=>a.active!==false);
  const deliveryOn=S.deliveryTimer.enabled;

  // Header
  let h=`<header class="safe-top bg-black/90 backdrop-blur-lg border-b border-white/5 flex-shrink-0">
    <div class="px-4 h-[52px] flex items-center justify-between">
      <div><div class="font-syne font-extrabold text-[17px]"><span class="text-yellow-400">RAAJ</span> <span class="text-[14px]">MULTIMEDIA</span></div></div>
      <div class="flex items-center gap-2">
        <button onclick="lookupOrder()" class="h-7 px-2 rounded-full bg-white/5 border border-white/10 text-[10px] font-bold">📦 Track</button>
        ${S.user?`<button onclick="S.tab='Account';render()" class="h-7 w-7 rounded-full bg-yellow-400 text-black text-[11px] font-bold">${S.user.name?S.user.name[0]:'?'}</button>`:`<button onclick="S.showAuth=true;render()" class="h-7 px-2 rounded-full bg-yellow-400 text-black text-[10px] font-bold">Login</button>`}
      </div>
    </div></header>`;

  // Announcement
  if(activeAnnounce){h+=`<div class="bg-yellow-400/10 border-b border-yellow-400/20 px-4 py-2 text-[11px] text-yellow-400 font-bold flex-shrink-0">📢 ${activeAnnounce.message}</div>`}

  // Delivery Timer
  if(deliveryOn){h+=`<div class="bg-emerald-500/10 border-b border-emerald-500/20 px-4 py-1 text-[10px] text-emerald-400 font-bold flex-shrink-0">🚚 ${S.deliveryTimer.label||'Delivering in'} ${S.deliveryTimer.minutes||10} mins</div>`}

  // Content (scrollable)
  let body='';

  if(S.showAuth){
    body=renderAuth();
  }else if(S.tab==='Home'){
    body=renderHome(activeAdverts);
  }else if(S.tab==='Data'){
    body=renderData();
  }else if(S.tab==='Airtime'){
    body=renderAirtime();
  }else if(S.tab==='Checkers'){
    body=renderCheckers();
  }else if(S.tab==='AFA'){
    body=renderAFATab();
  }else if(S.tab==='Account'){
    body=renderAccount();
  }

  // Bottom Nav
  const navItems=['Home','Data','Airtime','Checkers','AFA'];
  const navIcons=['🏠','📡','📱','🎓','🇬🇭'];
  const nav=`<nav class="safe-bottom bg-black/95 backdrop-blur-lg border-t border-white/5 flex-shrink-0">
    <div class="flex justify-around py-1">
      ${navItems.map((n,i)=>`<button onclick="S.tab='${n}';S.subTab='MTN';render()" class="flex flex-col items-center py-1 px-2 ${S.tab===n?'text-yellow-400':'text-zinc-500'}">
        <span class="text-[18px]">${navIcons[i]}</span><span class="text-[9px] font-bold mt-0.5">${n}</span>
      </button>`).join('')}
    </div></nav>`;

  // Install banner
  let installBanner='';
  if(deferredPrompt){
    installBanner=`<div class="bg-yellow-400 text-black px-4 py-2 text-[11px] font-bold flex justify-between items-center flex-shrink-0">
      <span>📲 Install Raaj Data App on your phone!</span>
      <button onclick="installApp()" class="h-7 px-3 rounded-full bg-black text-white text-[10px] font-bold">Install</button>
    </div>`;
  }

  app.innerHTML=h+installBanner+`<div class="flex-1 overflow-y-auto overscroll-contain">${body}</div>`+nav;
}

    <button onclick="claimGift()" class="w-full h-11 rounded-2xl bg-gradient-to-r from-purple-500/20 to-pink-500/20 border border-purple-400/20 text-[12px] font-bold text-purple-300">🎁 Claim Gift Code</button>

    <!-- Actions -->
    <div class="space-y-2">
      <button onclick="lookupOrder()" class="w-full h-10 rounded-full bg-white/5 text-zinc-300 font-bold text-[12px]">📦 Track Another Order</button>
      <a href="https://wa.me/233${MOMO.slice(1)}" class="block h-10 rounded-full bg-emerald-500/20 text-emerald-400 font-bold text-[12px] text-center leading-[40px]">💬 WhatsApp Support</a>
      <button onclick="logout()" class="w-full h-10 rounded-full bg-red-500/10 text-red-400 font-bold text-[12px]">Logout</button>
    </div>
  </div>`;
  return html;
}

/* --- INSTALL APP --- */
function installApp(){
  if(deferredPrompt){deferredPrompt.prompt();deferredPrompt.userChoice.then(r=>{deferredPrompt=null});}
}

/* --- INIT --- */
window.onload=function(){loadAll();render();
  // Refresh every 3 min
  setInterval(()=>{syncCloud().then(()=>render())},180000);
};

// Expose functions
window.S=S;window.render=render;window.buyBundle=buyBundle;window.buyAirtime=buyAirtime;
window.buyChecker=buyChecker;window.submitAFA=submitAFA;window.lookupOrder=lookupOrder;
window.claimGift=claimGift;window.submitClaim=submitClaim;window.requestWithdrawApp=requestWithdrawApp;
window.registerCustomer=registerCustomer;window.loginCustomer=loginCustomer;
window.forgotPassword=forgotPassword;window.agentLoginApp=agentLoginApp;
window.logout=logout;window.installApp=installApp;
window.showModalContent=showModalContent;window.hideModal=hideModal;
window.renderModal=renderModal;
</script>
