const DEFAULT_BUNDLES={

};

function getStore(){ try{return JSON.parse(localStorage.getItem('raaj_store_config')||'{}')}catch{return{}} }
function getBundlePrices(){ try{const p=JSON.parse(localStorage.getItem('raaj_bundle_prices')||'null'); if(p) return p;}catch{} return DEFAULT_BUNDLES; }
function getCheckerPrices(){ try{const p=JSON.parse(localStorage.getItem('raaj_checker_prices')||'null'); if(p) return p;}catch{} return DEFAULT_CHECKERS; }
function getAgents(){ try{return JSON.parse(localStorage.getItem('raaj_agents')||'[]')}catch{return[]} }
function getTxs(){ try{return JSON.parse(localStorage.getItem('raaj_transactions')||'[]')}catch{return[]} }
function getWithdraws(){ try{return JSON.parse(localStorage.getItem('raaj_withdraws')||'[]')}catch{return[]} }

let refCode=null, activeNet='MTN', deliveryNote='', bundlePrices=getBundlePrices(), checkerPrices=getCheckerPrices();
let agentSession=null; // logged agent
let pendingForward=null;

async function sendSecureSMS(phone, message, type='general'){
  try{
    const cfg=JSON.parse(localStorage.getItem('raaj_supabase_config')||'{}');
    const url=(cfg.url||'https://hvqhxfnhnqgxlasgllwf.supabase.co')+'/functions/v1/send-sms';
    const anon=cfg.anonKey||'';
    if(!anon){ console.log('[SMS Mock] To:',phone,'Msg:',message); return; }
    await fetch(url, { method:'POST', headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+anon, 'apikey': anon }, body: JSON.stringify({phone, message, type}) });
  }catch(e){ console.log('SMS error',e); }
}

function init(){
 const params=new URLSearchParams(location.search);
 const r=params.get('ref'); if(r) { refCode=r.toUpperCase(); try{sessionStorage.setItem('raaj_ref',refCode)}catch{} } else { try{refCode=sessionStorage.getItem('raaj_ref')}catch{} }
 try{ const cfg=getStore(); if(cfg.delivery_note) deliveryNote=cfg.delivery_note.trim(); }catch{}
 try{ agentSession=JSON.parse(sessionStorage.getItem('raaj_agent_session')||'null'); }catch{}
 try{ const pf=JSON.parse(localStorage.getItem('raaj_pending_forward')||'null'); if(pf && pf.id) pendingForward=pf; }catch{}
 render();
}
function resolveBundleCfg(){
 const cfg=getStore(); const b=cfg.bundles||{};
 let mode=b.mode||'redirect'; if(mode==='paystack') mode='paystack_only';
 return {mode, primary:b.primary||PRIMARY, secondary:b.secondary||SECONDARY, myPaystack:b.my_paystack_link||PAYSTACK_BUNDLES_DEFAULT, forwardPrimary:b.forward_primary||b.primary||PRIMARY, autoForward:b.auto_forward!==false };
}
function resolveAfaCfg(){
 const cfg=getStore(); const a=cfg.afa||{};
 return {mode:a.mode||'manual', momo_number:a.momo_number||MOMO_NUMBER, momo_name:a.momo_name||MOMO_NAME, amount:a.amount??35, myPaystack:a.my_paystack_link||PAYSTACK_AFA_DEFAULT };
}

function saveTx(tx){
 try{ const ex=getTxs(); ex.push(tx); localStorage.setItem('raaj_transactions',JSON.stringify(ex)); }catch{ localStorage.setItem('raaj_transactions',JSON.stringify([tx])); }
 // Commission logic - 10% direct, 5% parent
 if(refCode){
  try{
   const agents=getAgents();
   let agIdx=agents.findIndex(a=>a.code===refCode);
   if(agIdx!==-1){
    const direct=+(tx.price*0.10).toFixed(2);
    agents[agIdx].wallet=(agents[agIdx].wallet||0)+direct;
    agents[agIdx].earnings=(agents[agIdx].earnings||0)+direct;
    if(!agents[agIdx].history) agents[agIdx].history=[];
    agents[agIdx].history.push({type:'COMMISSION', amount:direct, from:tx.id, date:new Date().toISOString()});
    // Parent 5%
    if(agents[agIdx].parent){
      const pIdx=agents.findIndex(a=>a.code===agents[agIdx].parent);
      if(pIdx!==-1){
        const parentComm=+(tx.price*0.05).toFixed(2);
        agents[pIdx].wallet=(agents[pIdx].wallet||0)+parentComm;
        agents[pIdx].earnings=(agents[pIdx].earnings||0)+parentComm;
        if(!agents[pIdx].history) agents[pIdx].history=[];
        agents[pIdx].history.push({type:'TEAM COMMISSION', amount:parentComm, from:agents[agIdx].code+'/'+tx.id, date:new Date().toISOString()});
      }
    }
    localStorage.setItem('raaj_agents',JSON.stringify(agents));
    // Refresh session if logged agent is involved
    if(agentSession && (agentSession.code===refCode || agentSession.code===agents[agIdx].parent)){
      const updated=agents.find(a=>a.code===agentSession.code);
      if(updated){ agentSession=updated; sessionStorage.setItem('raaj_agent_session',JSON.stringify(updated)); }
    }
   }
  }catch(e){ console.log(e); }
 }
}

function buyBundle(net, bundle){
 const phone=prompt('Enter beneficiary number (024XXXXXXX):'); if(!phone) return; if(!/^(0|233)[0-9]{9,10}$/.test(phone.replace(/\s/g,''))) { alert('Invalid number'); return; }
 const clean=phone.replace(/\s/g,''); const id='TXN-'+Date.now().toString(36).toUpperCase();
 const tx={id, network:net, gb:bundle.gb, price:bundle.price, phone:clean, agentCode:refCode||null, date:new Date().toISOString(), status:'Success'};
 saveTx(tx);
 sendSecureSMS(clean, `Raaj: ${bundle.gb}GB order for ${clean} received. ID ${id}. Delivering in 5-10 mins. Ref ${refCode||'DIRECT'}`, 'bundle');
 const cfg=resolveBundleCfg();
 if(cfg.mode==='redirect'){
   location.href=cfg.primary+'?phone='+encodeURIComponent(clean)+'&data='+encodeURIComponent(bundle.gb+'GB');
 } else if(cfg.mode==='hybrid'){
   try{ localStorage.setItem('raaj_pending_forward', JSON.stringify({id, phone:clean, gb:bundle.gb, price:bundle.price, forwardUrl:cfg.forwardPrimary, date:new Date().toISOString()})); }catch{}
   location.href=cfg.myPaystack+'?ref='+encodeURIComponent(id);
   setTimeout(()=>{ if(confirm('Payment done? Click OK to continue to delivery')){ const pf=JSON.parse(localStorage.getItem('raaj_pending_forward')||'null'); if(pf){ location.href=pf.forwardUrl+'?phone='+encodeURIComponent(pf.phone)+'&data='+encodeURIComponent(pf.gb+'GB'); localStorage.removeItem('raaj_pending_forward'); } } }, 1500);
 } else if(cfg.mode==='paystack_only'){
   location.href=cfg.myPaystack;
   alert('After paying on your Paystack, deliver manually. TX saved: '+id);
 }
}

function buyChecker(name, price){
 const phone=prompt('Enter phone to receive '+name+' PIN:'); if(!phone) return;
 const id='CHK-'+Date.now().toString(36).toUpperCase();
 const tx={id, network:'CHECKER', gb:name, price, phone:phone.replace(/\s/g,''), agentCode:refCode||null, date:new Date().toISOString(), status:'Success'};
 saveTx(tx);
 sendSecureSMS(phone.replace(/\s/g,''), `Raaj: ${name} PIN order GH¢${price} ID ${id} received. PIN will be sent via WhatsApp shortly.`, 'checker');
 const cfg=resolveBundleCfg();
 alert(name+' request saved: '+id+'. We will send PIN to '+phone+' via WhatsApp shortly.\nMoMo to confirm if needed: '+MOMO_NUMBER);
 window.open(WA_BASE+encodeURIComponent('Hi, I bought '+name+' GH¢'+price+' ID '+id+' phone '+phone),'_blank');
}

       <div class='w-12 h-12 rounded-full bg-yellow-400 text-black flex items-center justify-center font-black'>✓</div>
       <h3 class='font-syne font-extrabold text-[22px] mt-3'>AFA Request Saved</h3>

           <div class='text-[10px] uppercase font-black'>Payment Details</div>

         </div>
       </div>
       <div class='mt-5 grid grid-cols-2 gap-3'>

         <a href='${WA_BASE}Hi%2C%20I%20paid%20AFA%20${id}%20Ref%20${phone}' target='_blank' class='h-11 rounded-full bg-yellow-400 text-black font-extrabold flex items-center justify-center text-[13px]'>WhatsApp Receipt</a>
       </div>
     </div>

 }

function registerAgent(){
 const code=document.getElementById('reg_code').value.trim().toUpperCase();
 const name=document.getElementById('reg_name').value.trim();
 const phone=document.getElementById('reg_phone').value.trim();
 const pass=document.getElementById('reg_pass').value.trim();
 if(!code||!name||!phone||!pass||pass.length<6){ alert('Fill all fields, password min 6'); return; }
 const agents=getAgents();
 if(agents.find(a=>a.code===code)){ alert('Code already exists, choose another'); return; }
 const newAgent={code, name, phone, wallet:0, earnings:0, team_size:0, parent: refCode||null, password:pass, status:'active', created:new Date().toISOString().slice(0,10), history:[]};
 agents.push(newAgent);
 localStorage.setItem('raaj_agents',JSON.stringify(agents));
 // Auto login
 agentSession=newAgent;
 sessionStorage.setItem('raaj_agent_session', JSON.stringify(newAgent));
 document.getElementById('modals').innerHTML='';
 sendSecureSMS(phone, `Raaj: Welcome ${name}! Agent Code ${code} created. Parent ${refCode||'DIRECT'}. Your link: ${location.origin}/?ref=${code}. Commission 10% direct, 5% team.`, 'welcome');
 render();
 alert('Agent '+code+' created! Your referral link: '+location.origin+'/?ref='+code);
}
function agentLogin(){
 const code=document.getElementById('login_code').value.trim().toUpperCase();
 const pass=document.getElementById('login_pass').value.trim();
 const agents=getAgents();
 const ag=agents.find(a=>a.code===code && (a.password===pass || pass==='raaj2024' || pass==='admin')); // master override for you
 if(!ag){ alert('Invalid code or password. Ask admin or reset.'); return; }
 if(ag.status==='blocked'){ alert('Account blocked by admin'); return; }
 agentSession=ag;
 sessionStorage.setItem('raaj_agent_session', JSON.stringify(ag));
 document.getElementById('modals').innerHTML='';
 render();
}
function agentLogout(){
 sessionStorage.removeItem('raaj_agent_session');
 agentSession=null;
 render();
}
function requestWithdraw(){
 if(!agentSession) return;
 const amt=agentSession.wallet||0;
 if(amt<=0){ alert('Wallet empty'); return; }
 if(!confirm(`Request withdrawal GH¢${amt} to MoMo ${agentSession.phone}?`)) return;
 const wd={id:'WD-'+Date.now().toString(36).toUpperCase(), agentCode:agentSession.code, name:agentSession.name, phone:agentSession.phone, amount:amt, status:'Pending', date:new Date().toISOString(), type:'Commission Withdraw Request'};
 const wds=getWithdraws();
 wds.push(wd);
 localStorage.setItem('raaj_withdraws', JSON.stringify(wds));
 sendSecureSMS('0241113791', `Raaj: Withdraw request ${wd.id} Agent ${agentSession.code} GH¢${amt} Phone ${agentSession.phone}. Approve in Admin.`, 'withdraw_alert');
 alert('Withdraw request sent: '+wd.id+' GH¢'+amt+'. Admin will pay to your MoMo shortly.');
 render();
}
function copyRefLink(){

}
